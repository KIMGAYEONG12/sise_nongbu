name: sise_nongbu
description: 실제 공영도매시장 경매 시세로 움직이는 농장 시뮬레이션 게임
publish_to: none
version: 1.0.0+31
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  shared_preferences: ^2.3.2
  http: ^1.2.2
  image_picker: ^1.2.4
  speech_to_text: ^7.5.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.3
  in_app_update: ^5.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  fonts:
    # 한글 글꼴 Noto Sans KR (오픈 라이선스 OFL, 가변 글꼴): 굵기별로 정확한 글자 모양이라 두꺼운 글씨도 뭉개지지 않는다
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
  assets:
    - assets/auction_sample.json
    - assets/images/
